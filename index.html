<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 MQTT Music Player Dashboard</title>
    <!-- Nhúng thư viện MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { margin-bottom: 5px; color: #2c3e50; }
        .broker-status {
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #e67e22;
        }
        .status-box {
            background: #222;
            color: #00ffcc;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            margin-bottom: 20px;
            min-height: 24px;
        }
        .control-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            transition: 0.2s;
        }
        button:active { transform: scale(0.96); }
        .btn-play { background-color: #2ecc71; }
        .btn-pause { background-color: #f39c12; }
        .btn-stop { background-color: #e74c3c; }
        .btn-nav { background-color: #3498db; grid-column: span 1.5; }
        
        .slider-container, .switch-container {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
        }
        .slider-container label, .switch-container label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 26px;
        }
.slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #2ecc71; }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎵 MQTT Music Player</h2>
        <div class="broker-status" id="connectionStatus">Đang kết nối EMQX Broker...</div>

        <!-- Trạng thái phản hồi từ ESP8266 (Topic: i40/class01/music/status) -->
        <div class="status-box" id="statusDisplay">Chờ thiết bị phản hồi...</div>

        <!-- Nút điều khiển (Topic: i40/class01/music/cmd) -->
        <div class="control-group">
            <button class="btn-play" onclick="sendCmd('play')">▶ Phát</button>
            <button class="btn-pause" onclick="sendCmd('pause')">⏸ Tạm dừng</button>
            <button class="btn-stop" onclick="sendCmd('stop')">⏹ Dừng</button>
            <button class="btn-nav" onclick="sendCmd('prev')">⏮ Bài trước</button>
            <button class="btn-nav" onclick="sendCmd('next')">⏭ Bài sau</button>
        </div>

        <!-- Thanh trượt âm lượng (Topic: i40/class01/music/volume) -->
        <div class="slider-container">
            <label for="volumeSlider">🔊 Âm lượng (<span id="volVal">5</span>):</label>
            <input type="range" id="volumeSlider" min="0" max="10" value="5" step="1" oninput="updateVolume(this.value)">
        </div>

        <!-- Nút gạt vòng lặp (Topic: i40/class01/music/cmd) -->
        <div class="switch-container">
            <div class="switch-row">
                <label for="loopSwitch">🔁 Vòng lặp (Loop):</label>
                <label class="switch">
                    <input type="checkbox" id="loopSwitch" onchange="toggleLoop(this)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        // Kết nối EMQX Broker qua cổng WebSocket bảo mật (wss) tương thích Cloudflare[cite: 1]
        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
        const clientOptions = {
            clientId: 'WebMusicPlayer_' + Math.random().toString(16).substr(2, 8),
            clean: true
        };

        const client = mqtt.connect(brokerUrl, clientOptions);

        const TOPIC_CMD = 'i40/class01/music/cmd';
        const TOPIC_VOL = 'i40/class01/music/volume';
        const TOPIC_STATUS = 'i40/class01/music/status';

        const statusEl = document.getElementById('connectionStatus');
        const statusDisplayEl = document.getElementById('statusDisplay');

        client.on('connect', () => {
            statusEl.innerText = 'Đã kết nối EMQX thành công! ✅';
            statusEl.style.color = '#2ecc71';
// Lắng nghe trạng thái từ ESP8266 gửi về[cite: 1]
            client.subscribe(TOPIC_STATUS, (err) => {
                if (!err) console.log('Đã đăng ký nhận topic status');
            });
        });

        client.on('error', (err) => {
            statusEl.innerText = 'Lỗi kết nối MQTT! ❌';
            statusEl.style.color = '#e74c3c';
            console.error(err);
        });

        client.on('message', (topic, payload) => {
            if (topic === TOPIC_STATUS) {
                statusDisplayEl.innerText = payload.toString();
            }
        });

        function sendCmd(payload) {
            client.publish(TOPIC_CMD, payload);
        }

        function updateVolume(val) {
            document.getElementById('volVal').innerText = val;
            client.publish(TOPIC_VOL, val);
        }

        function toggleLoop(checkbox) {
            const payload = checkbox.checked ? 'loop_on' : 'loop_off';
            client.publish(TOPIC_CMD, payload);
        }
    </script>
</body>
</html>
