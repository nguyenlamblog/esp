<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>IoT Dashboard - Giám Sát Nhiệt Độ</title>
    <!-- Thêm thư viện MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        .alert { background-color: #ff4d4d; color: white; padding: 15px; border-radius: 5px; margin-top: 20px; display: none; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 15px; cursor: pointer; background-color: #333; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #555; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌡️ Giám Sát Nhiệt Độ & Độ Ẩm ESP8266</h2>
        <p>Nhiệt độ: <span id="temp">--</span> °C</p>
        <p>Độ ẩm: <span id="humi">--</span> %</p>
        
        <!-- Khung cảnh báo và Nút tắt còi -->
        <div id="alertBox" class="alert">
            <h3>⚠️ CẢNH BÁO: QUÁ NHIỆT!</h3>
            <p>Nhiệt độ đã vượt ngưỡng cho phép!</p>
            <button onclick="muteAlarm()">🔇 Tắt còi / Dừng báo động</button>
        </div>
    </div>

    <script>
        // Kết nối MQTT Broker công khai
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        const TOPIC_TEMP  = "i40/class01/sensor/temp";
        const TOPIC_HUMI  = "i40/class01/sensor/humi";
        const TOPIC_ALERT = "i40/class01/sensor/alert";

        let audioCtx = null;
        let alarmInterval = null;
        let isMutedManually = false; // Biến kiểm tra xem người dùng có chủ động tắt còi không

        client.on('connect', function () {
            console.log("Đã kết nối MQTT Broker thành công!");
            client.subscribe(TOPIC_TEMP);
            client.subscribe(TOPIC_HUMI);
            client.subscribe(TOPIC_ALERT);
        });

        client.on('message', function (topic, message) {
            let msgStr = message.toString();
            
            if (topic === TOPIC_TEMP) {
                document.getElementById('temp').innerText = msgStr;
            } else if (topic === TOPIC_HUMI) {
                document.getElementById('humi').innerText = msgStr;
            } else if (topic === TOPIC_ALERT) {
                let alertBox = document.getElementById('alertBox');
                
                if (msgStr.includes("high temperature!")) {
                    alertBox.style.display = "block";
                    
                    // Nếu người dùng chưa bấm nút tắt còi thủ công thì mới phát âm thanh
                    if (!isMutedManually) {
                        startBeepSound();
                    }
                } else if (msgStr === "normal" || msgStr === "sensor online") {
                    alertBox.style.display = "none";
                    stopBeepSound();
                    isMutedManually = false; // Reset lại trạng thái khi nhiệt độ đã bình thường
                }
            }
        });

        // Hàm phát âm thanh bíp liên tục trên web
        function startBeepSound() {
            if (alarmInterval) return; // Đang kêu thì thôi
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Tạo tiếng bíp lặp lại mỗi 1 giây
            alarmInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = 800; // Tần số âm thanh bíp
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                let now = audioCtx.currentTime;
                osc.start(now);
                gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4); // Kêu trong 0.4 giây
                osc.stop(now + 0.4);
            }, 1000);
        }

        // Hàm tắt âm thanh báo động
        function stopBeepSound() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // Khi người dùng bấm nút "Tắt còi" trên giao diện
        function muteAlarm() {
            stopBeepSound();             // Dừng tiếng kêu trên web ngay lập tức
            isMutedManually = true;      // Đánh dấu là đã tắt thủ công để nó không tự kêu lại chừng nào chưa về normal
            alert("Đã tắt âm thanh cảnh báo trên trình duyệt!");
        }
    </script>
</body>
</html>
